site_name: ML Math Foundations Mastery Path
site_description: A structured, module-wise course on the mathematical foundations of AI/ML — derivatives and calculus, vectors and linear algebra, probability and statistics — and how they underpin machine learning algorithms like gradient descent and backpropagation.
site_url: https://sigilipelli.github.io/ml-math-mastery-path/
repo_url: https://github.com/SIGILIPELLI/ml-math-mastery-path
repo_name: ml-math-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Why Math Matters for ML": level-1/01-why-math-matters.md
      - "02 · Scalars, Vectors & Matrices": level-1/02-scalars-vectors-matrices.md
      - "03 · Vector Operations": level-1/03-vector-operations.md
      - "04 · Matrix Operations": level-1/04-matrix-operations.md
      - "05 · Functions & Graphs Refresher": level-1/05-functions-graphs.md
      - "06 · What Is a Derivative?": level-1/06-what-is-a-derivative.md
      - "07 · Basic Derivative Rules": level-1/07-derivative-rules.md
      - "08 · Partial Derivatives & Gradients": level-1/08-partial-derivatives-gradients.md
      - "09 · Linear Regression as a Math Example": level-1/09-linear-regression-math.md
      - "10 · Capstone — Derive & Verify a Gradient": level-1/10-capstone-gradient.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "01 · Gradient Descent Step-by-Step": level-2/01-gradient-descent.md
      - "02 · Chain Rule Deep Dive": level-2/02-chain-rule-deep-dive.md
      - "03 · Jacobians & Hessians": level-2/03-jacobians-hessians.md
      - "04 · Eigenvalues & Eigenvectors Intuition": level-2/04-eigenvalues-eigenvectors.md
      - "05 · Matrix Decompositions Overview": level-2/05-matrix-decompositions.md
      - "06 · Probability Basics": level-2/06-probability-basics.md
      - "07 · Expectation & Variance": level-2/07-expectation-variance.md
      - "08 · Bayes' Theorem": level-2/08-bayes-theorem.md
      - "09 · Distributions Used in ML": level-2/09-distributions-in-ml.md
